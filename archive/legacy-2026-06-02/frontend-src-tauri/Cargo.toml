[package]
name = "novel-cockpit"
version = "0.1.0"
description = "Cherry Studio 小说创作悬浮资料台"
authors = ["zero"]
edition = "2021"

[lib]
name = "novel_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
