<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>章节概览示意页</title>
    <style>
      :root {
        --bg: #f4efe6;
        --paper: #fbf7ef;
        --paper-2: #f6efe3;
        --paper-3: #efe4d4;
        --line: #d8cab7;
        --line-soft: #e9dfd1;
        --text: #2e2418;
        --muted: #6d5d4b;
        --accent: #8a5a3d;
        --accent-2: #6f8662;
        --accent-3: #6d7ea4;
        --danger: #9a5f52;
        --warning: #9a7540;
        --shadow: 0 18px 42px rgba(72, 54, 31, 0.11);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.5), transparent 32%),
          radial-gradient(circle at 82% 10%, rgba(109, 126, 164, 0.12), transparent 24%),
          linear-gradient(180deg, #f8f3ea, #efe5d7);
        font-family: "KaiTi", "STKaiti", "Songti SC", "SimSun", serif;
        text-rendering: optimizeLegibility;
      }

      body {
        padding: 28px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(111, 134, 98, 0.32);
        outline-offset: 2px;
      }

      .page {
        max-width: 1560px;
        margin: 0 auto;
      }

      .header {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        letter-spacing: 0;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 34px;
        line-height: 1.12;
        font-weight: 700;
      }

      .subtitle {
        max-width: 80ch;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.82;
      }

      .shell {
        display: grid;
        grid-template-columns: 312px minmax(0, 1fr) 390px;
        gap: 16px;
        align-items: start;
      }

      .panel {
        background: rgba(251, 247, 239, 0.96);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .sidebar,
      .detailPanel {
        position: sticky;
        top: 16px;
      }

      .sidebar {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .panelHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panelHead h2,
      .panelHead h3 {
        font-size: 18px;
        line-height: 1.2;
      }

      .countBadge,
      .chip,
      .typePill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--paper-2);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .searchBox {
        display: grid;
        gap: 8px;
      }

      .searchBox span {
        color: var(--muted);
        font-size: 13px;
      }

      .searchBox input {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        color: var(--text);
        background: #fffaf2;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .filterGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filterButton,
      .chapterCard,
      .ghostButton,
      .eventCard {
        border: 1px solid var(--line);
      }

      .filterButton,
      .ghostButton {
        min-height: 32px;
        padding: 0 11px;
        color: var(--muted);
        background: #fbf7ef;
        border-radius: 999px;
      }

      .filterButton.active,
      .ghostButton.active {
        color: #533325;
        background: #ead7c3;
        border-color: #c59f7c;
      }

      .chapterList {
        display: grid;
        gap: 9px;
      }

      .chapterCard {
        display: grid;
        gap: 7px;
        width: 100%;
        padding: 12px;
        text-align: left;
        color: var(--text);
        background: linear-gradient(180deg, #fcfaf4, #f5ede0);
        border-radius: 14px;
        transition:
          transform 0.14s ease,
          border-color 0.14s ease,
          background 0.14s ease,
          box-shadow 0.14s ease;
      }

      .chapterCard:hover {
        transform: translateY(-1px);
        border-color: #cdbca6;
        box-shadow: 0 10px 22px rgba(73, 52, 28, 0.08);
      }

      .chapterCard.active {
        background: linear-gradient(180deg, #f4f8f2, #ecf2e5);
        border-color: rgba(111, 134, 98, 0.68);
        box-shadow: inset 0 0 0 1px rgba(111, 134, 98, 0.1);
      }

      .chapterCard strong {
        font-size: 17px;
        line-height: 1.24;
      }

      .chapterCard small,
      .chapterStats {
        color: var(--muted);
        line-height: 1.55;
      }

      .chapterStats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 13px;
      }

      .timelinePanel {
        overflow: hidden;
      }

      .timelineTop {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #fcfaf6, #f5eee4);
      }

      .timelineTop h2 {
        font-size: 26px;
        line-height: 1.15;
      }

      .timelineTop p {
        margin-top: 7px;
        color: var(--muted);
        line-height: 1.65;
      }

      .viewTabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .timelineBody {
        display: grid;
        gap: 0;
        padding: 16px 18px 20px;
      }

      .chapterGroup {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 16px;
        position: relative;
      }

      .chapterGroup + .chapterGroup {
        margin-top: 18px;
      }

      .chapterMarker {
        position: sticky;
        top: 20px;
        align-self: start;
        display: grid;
        gap: 6px;
        padding: 10px 0;
      }

      .chapterMarker strong {
        font-size: 18px;
      }

      .chapterMarker span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .eventRail {
        position: relative;
        display: grid;
        gap: 10px;
        padding-left: 20px;
      }

      .eventRail::before {
        content: "";
        position: absolute;
        top: 12px;
        bottom: 12px;
        left: 5px;
        width: 2px;
        background: linear-gradient(180deg, rgba(138, 90, 61, 0.34), rgba(111, 134, 98, 0.28));
      }

      .eventCard {
        position: relative;
        display: grid;
        gap: 9px;
        width: 100%;
        padding: 13px 14px;
        text-align: left;
        color: var(--text);
        background: rgba(255, 251, 244, 0.92);
        border-radius: 14px;
        transition:
          transform 0.14s ease,
          background 0.14s ease,
          border-color 0.14s ease,
          box-shadow 0.14s ease;
      }

      .eventCard::before {
        content: "";
        position: absolute;
        top: 19px;
        left: -22px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #f3e4d2;
        border: 2px solid var(--accent);
        box-shadow: 0 0 0 4px rgba(251, 247, 239, 0.96);
      }

      .eventCard:hover {
        transform: translateY(-1px);
        border-color: #cdbca6;
        box-shadow: 0 10px 20px rgba(73, 52, 28, 0.08);
      }

      .eventCard.active {
        background: linear-gradient(180deg, #fff9ef, #f3eadc);
        border-color: rgba(138, 90, 61, 0.68);
        box-shadow: inset 0 0 0 1px rgba(138, 90, 61, 0.1);
      }

      .eventCard.active::before {
        background: var(--accent);
      }

      .eventHead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .eventTitle {
        display: grid;
        gap: 4px;
      }

      .eventTitle strong {
        font-size: 19px;
        line-height: 1.28;
      }

      .eventTitle small {
        color: var(--muted);
        line-height: 1.5;
      }

      .eventSummary {
        color: var(--text);
        line-height: 1.76;
      }

      .eventMeta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .typePill.main {
        color: #533325;
        background: #ead7c3;
        border-color: #c59f7c;
      }

      .typePill.character {
        color: #43543c;
        background: #e7efdf;
        border-color: #b4c7a6;
      }

      .typePill.faction {
        color: #3c4962;
        background: #e2e8f4;
        border-color: #aeb9d2;
      }

      .typePill.hook {
        color: #705127;
        background: #f0e3c4;
        border-color: #d1b475;
      }

      .typePill.danger {
        color: #63362f;
        background: #efdcd7;
        border-color: #c8958a;
      }

      .detailPanel {
        display: grid;
        gap: 14px;
      }

      .detailCard {
        padding: 16px;
      }

      .detailTitle {
        display: grid;
        gap: 8px;
        padding-bottom: 13px;
        border-bottom: 1px solid var(--line-soft);
      }

      .detailTitle h2 {
        font-size: 24px;
        line-height: 1.24;
      }

      .detailTitle p {
        color: var(--muted);
        line-height: 1.65;
      }

      .kvList {
        display: grid;
        gap: 11px;
        margin-top: 13px;
      }

      .kv {
        display: grid;
        gap: 5px;
      }

      .kv span {
        color: var(--muted);
        font-size: 13px;
      }

      .kv strong,
      .kv div {
        color: var(--text);
        line-height: 1.7;
      }

      .tagList {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .hookList {
        display: grid;
        gap: 9px;
        margin-top: 12px;
      }

      .hookItem {
        display: grid;
        gap: 5px;
        padding: 10px 11px;
        background: rgba(246, 239, 227, 0.72);
        border: 1px solid var(--line-soft);
        border-radius: 12px;
      }

      .hookItem strong {
        font-size: 16px;
      }

      .hookItem span {
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }

      .empty {
        padding: 28px;
        color: var(--muted);
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 14px;
        background: rgba(255, 251, 244, 0.58);
      }

      .editMock {
        display: grid;
        gap: 10px;
        padding: 14px;
        background: rgba(246, 239, 227, 0.65);
        border-top: 1px solid var(--line-soft);
      }

      .editMock label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .editMock input,
      .editMock textarea {
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        color: var(--text);
        background: #fffaf2;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .editMock textarea {
        min-height: 86px;
        resize: vertical;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .saveButton {
        min-height: 38px;
        padding: 0 14px;
        color: #fffaf2;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 10px;
      }

      .legendCard {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
      }

      .legendGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .legendGrid span {
        justify-content: flex-start;
      }

      @media (max-width: 1180px) {
        .shell {
          grid-template-columns: 280px minmax(0, 1fr);
        }

        .detailPanel {
          grid-column: 1 / -1;
          position: static;
        }
      }

      @media (max-width: 820px) {
        body {
          padding: 18px;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
        }

        .chapterGroup {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .chapterMarker {
          position: static;
          padding: 0;
        }

        .timelineTop {
          display: grid;
        }

        .viewTabs {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">小说知识库 · 章节概览模块示意</p>
        <h1>章节概览</h1>
        <p class="subtitle">
          用章节作为骨架，记录这一章讲述、揭示、补完了哪些关键事实。它不承担真实时间顺序，而是帮助作者核对每章摘要、伏笔和读者获得信息的过程。
        </p>
      </header>

      <section class="shell">
        <aside class="panel sidebar">
          <div class="panelHead">
            <h2>章节册</h2>
            <span class="countBadge" id="chapterCount">0 章</span>
          </div>

          <label class="searchBox">
            <span>搜索事件</span>
            <input id="searchInput" type="search" placeholder="人物、地点、势力、伏笔关键词" />
          </label>

          <div class="filterGrid" id="filterGrid"></div>

          <div class="chapterList" id="chapterList"></div>
        </aside>

        <section class="panel timelinePanel">
          <div class="timelineTop">
            <div>
              <p class="eyebrow">当前视图</p>
              <h2 id="timelineTitle">全书章节事实册</h2>
              <p id="timelineSummary">按章节显示已经确认的关键事实。点击事件可查看结构化详情。</p>
            </div>
            <div class="viewTabs">
              <button class="ghostButton active" type="button">章节事实</button>
              <button class="ghostButton" type="button">章节摘要</button>
              <button class="ghostButton" type="button">本章伏笔</button>
            </div>
          </div>
          <div class="timelineBody" id="timelineBody"></div>
        </section>

        <aside class="detailPanel">
          <section class="panel detailCard">
            <div class="detailTitle">
              <p class="eyebrow">事件详情</p>
              <h2 id="detailTitle">选择一个事件</h2>
              <p id="detailSummary">右侧显示本章中被讲述或揭示的事件、参与者、地点、势力、影响结果和伏笔变化。</p>
            </div>
            <div class="kvList" id="detailBody"></div>
          </section>

          <section class="panel legendCard">
            <div class="panelHead">
              <h3>章节事实类型</h3>
              <span class="countBadge" id="eventCount">0 条</span>
            </div>
            <div class="legendGrid">
              <span class="typePill main">主线推进</span>
              <span class="typePill character">人物变化</span>
              <span class="typePill faction">势力变化</span>
              <span class="typePill hook">伏笔</span>
              <span class="typePill danger">死亡失踪</span>
              <span class="typePill">设定补充</span>
            </div>
          </section>

          <section class="panel">
            <div class="editMock">
              <div class="panelHead">
                <h3>编辑形态示意</h3>
                <span class="chip">仅演示</span>
              </div>
              <label>
                事件标题
                <input value="林玄拜入天元宗" />
              </label>
              <label>
                事件说明
                <textarea>林玄在问心阶显露异常神魂，被天元宗外门长老收下。</textarea>
              </label>
              <div class="actions">
                <button class="ghostButton" type="button">取消</button>
                <button class="saveButton" type="button">保存事件</button>
              </div>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script>
      const chapters = [
        {
          id: "all",
          label: "全书",
          title: "全部章节事实",
          note: "按叙述章节查看关键事实",

        {
          id: "chapter-1",

        {

      ];

      const filters = [
        { id: "全部", label: "全部" },
        { id: "主线推进", label: "主线" },
        { id: "人物变化", label: "人物" },
        { id: "势力变化", label: "势力" },
        { id: "伏笔", label: "伏笔" },
        { id: "死亡失踪", label: "死亡失踪" },
        { id: "设定补充", label: "设定" },
      ];

      const typeClass = {
        主线推进: "main",
        人物变化: "character",
        势力变化: "faction",
        伏笔: "hook",
        死亡失踪: "danger",
      };

      const events = [

          title: "林玄登上问心阶",
          time: "天元宗收徒日，午后",

          summary: "林玄在问心阶第七百二十阶停步，神魂异象短暂显现，被外门长老陆衡注意。",

        {

        {

          characters: ["陆衡", "林玄", "外门新弟子"],
          factions: ["天元宗"],
          consequences: "境界体系获得明确规则，可写入境界设定。",
          hooks: ["林玄经脉数量异常"],
          status: "已确认",
          source: "第 2 章，第 4 节",
        },
        {
          id: "e-5",
          chapter: 3,
          order: "01",
          type: "势力变化",
          title: "青岚盟与黑水府翻脸",
          time: "青岚洲议事会",
          location: "青岚洲主城",
          summary: "青岚盟公开质疑黑水府私藏龙渊秘境钥令，两方盟约出现裂缝。",
          characters: ["青岚盟主", "黑水府使者", "苏璃"],
          factions: ["青岚盟", "黑水府", "圣女殿"],
          consequences: "青岚洲从暗斗转入明争，秘境线提前升温。",
          hooks: ["龙渊秘境钥令", "黑水府背后势力"],
          status: "已确认",
          source: "第 3 章，第 3 节",
        },
        {
          id: "e-6",
          chapter: 3,
          order: "02",
          type: "人物变化",
          title: "林玄获得残缺剑诀",
          time: "外门小比后",
          location: "天元宗剑阁",
          summary: "林玄以外门小比第二名换取进入剑阁的资格，意外选中残缺的青霜剑诀。",
          characters: ["林玄", "陆衡"],
          factions: ["天元宗"],
          consequences: "林玄战斗体系从体术转向剑术，青霜剑诀成为核心功法。",
          hooks: ["残缺剑诀为何主动共鸣"],
          status: "已确认",
          source: "第 3 章，第 6 节",
        },
        {
          id: "e-7",
          chapter: 4,
          order: "01",
          type: "死亡失踪",
          title: "黑水府使者失踪",
          time: "龙渊秘境开启前夜",
          location: "龙渊秘境入口",
          summary: "黑水府使者在看守钥令时失踪，现场只留下带血的传讯符和半截青色鳞片。",
          characters: ["黑水府使者", "苏璃", "林玄"],
          factions: ["黑水府", "青岚盟"],
          consequences: "各方互相怀疑，秘境入口封锁半夜。",
          hooks: ["青色鳞片", "失踪者是否死亡"],
          status: "待确认",
          source: "第 4 章，第 1 节",
        },
        {
          id: "e-8",
          chapter: 4,
          order: "02",
          type: "伏笔",
          title: "林玄血脉第一次失控",
          time: "秘境第一层，子时",
          location: "龙渊秘境",
          summary: "林玄接触龙渊石壁后血脉短暂失控，梦见一座沉在虚空海中的龙门。",
          characters: ["林玄", "苏璃"],
          factions: ["天元宗"],
          consequences: "林玄确认自身血脉与龙渊秘境有关，苏璃开始隐瞒她看到的玉坠反应。",
          hooks: ["虚空海龙门", "苏璃玉坠第二次发热", "林玄血脉来源"],
          status: "待回收",
          source: "第 4 章，第 5 节",
        },
      ];

      let activeChapter = "all";
      let activeFilter = "全部";
      let activeEventId = events[0].id;
      let keyword = "";

      const chapterList = document.querySelector("#chapterList");
      const chapterCount = document.querySelector("#chapterCount");
      const filterGrid = document.querySelector("#filterGrid");
      const timelineBody = document.querySelector("#timelineBody");
      const timelineTitle = document.querySelector("#timelineTitle");
      const timelineSummary = document.querySelector("#timelineSummary");
      const detailTitle = document.querySelector("#detailTitle");
      const detailSummary = document.querySelector("#detailSummary");
      const detailBody = document.querySelector("#detailBody");
      const eventCount = document.querySelector("#eventCount");
      const searchInput = document.querySelector("#searchInput");

      function eventMatches(event) {
        const chapterOk = activeChapter === "all" || event.chapter === Number(activeChapter.replace("chapter-", ""));
        const typeOk = activeFilter === "全部" || event.type === activeFilter;
        const text = [
          event.title,
          event.summary,
          event.location,
          event.time,
          event.status,
          event.characters.join(" "),
          event.factions.join(" "),
          event.hooks.join(" "),
        ].join(" ");
        const keywordOk = !keyword || text.includes(keyword);
        return chapterOk && typeOk && keywordOk;
      }

      function chapterEvents(chapter) {
        return events.filter((event) => event.chapter === chapter.chapter);
      }

      function filteredEvents() {
        return events.filter(eventMatches);
      }

      function renderFilters() {
        filterGrid.innerHTML = filters
          .map(
            (filter) => `
              <button class="filterButton ${filter.id === activeFilter ? "active" : ""}" type="button" data-filter="${filter.id}">
                ${filter.label}
              </button>
            `
          )
          .join("");
      }

      function renderChapters() {
        chapterCount.textContent = `${chapters.length - 1} 章`;
        chapterList.innerHTML = chapters
          .map((chapter) => {
            const list = chapter.id === "all" ? events : chapterEvents(chapter);
            const hookCount = list.filter((event) => event.type === "伏笔").length;
            const active = chapter.id === activeChapter ? "active" : "";
            return `
              <button class="chapterCard ${active}" type="button" data-chapter="${chapter.id}">
                <span class="chapterStats">
                  <span class="chip">${chapter.label}</span>
                  <span class="chip">${list.length} 事</span>
                  ${hookCount ? `<span class="chip">${hookCount} 伏笔</span>` : ""}
                </span>
                <strong>${chapter.title}</strong>
                <small>${chapter.note}</small>
              </button>
            `;
          })
          .join("");
      }

      function renderTimeline() {
        const visible = filteredEvents();
        eventCount.textContent = `${visible.length} 条`;
        const chapter = chapters.find((item) => item.id === activeChapter) || chapters[0];
        timelineTitle.textContent = activeChapter === "all" ? "全书章节事实册" : `${chapter.label}：${chapter.title}`;
        timelineSummary.textContent =
          activeFilter === "全部"
            ? "按叙述章节显示已经确认的关键事实。点击事件可查看结构化详情。"
            : `当前只显示「${activeFilter}」章节事实。`;

        const grouped = chapters
          .filter((chapterItem) => chapterItem.id !== "all")
          .map((chapterItem) => ({
            chapter: chapterItem,
            events: visible.filter((event) => event.chapter === chapterItem.chapter),
          }))
          .filter((group) => group.events.length);

        if (!grouped.length) {
          timelineBody.innerHTML = `<div class="empty">没有符合当前筛选条件的章节事实。</div>`;
          return;
        }

        timelineBody.innerHTML = grouped
          .map(
            (group) => `
              <section class="chapterGroup">
                <div class="chapterMarker">
                  <strong>${group.chapter.label}</strong>
                  <span>${group.chapter.title}</span>
                  <span>${group.events.length} 条事件</span>
                </div>
                <div class="eventRail">
                  ${group.events.map(renderEventCard).join("")}
                </div>
              </section>
            `
          )
          .join("");
      }

      function renderEventCard(event) {
        const active = event.id === activeEventId ? "active" : "";
        const css = typeClass[event.type] || "";
        return `
          <button class="eventCard ${active}" type="button" data-event="${event.id}">
            <div class="eventHead">
              <div class="eventTitle">
                <strong>${event.title}</strong>
                <small>第 ${event.chapter} 章 · 事件 ${event.order} · ${event.time}</small>
              </div>
              <span class="typePill ${css}">${event.type}</span>
            </div>
            <p class="eventSummary">${event.summary}</p>
            <div class="eventMeta">
              <span class="chip">${event.location}</span>
              <span class="chip">${event.status}</span>
              ${event.characters.slice(0, 3).map((name) => `<span class="chip">${name}</span>`).join("")}
            </div>
          </button>
        `;
      }

      function renderDetail() {
        const event = events.find((item) => item.id === activeEventId) || filteredEvents()[0] || events[0];
        activeEventId = event.id;
        detailTitle.textContent = event.title;
        detailSummary.textContent = `第 ${event.chapter} 章，${event.time}，${event.location}`;
        detailBody.innerHTML = `
          <div class="kv">
            <span>事件类型</span>
            <div class="tagList">
              <span class="typePill ${typeClass[event.type] || ""}">${event.type}</span>
              <span class="chip">${event.status}</span>
              <span class="chip">${event.source}</span>
            </div>
          </div>
          <div class="kv">
            <span>事件经过</span>
            <div>${event.summary}</div>
          </div>
          <div class="kv">
            <span>涉及人物</span>
            <div class="tagList">${event.characters.map((name) => `<span class="chip">${name}</span>`).join("")}</div>
          </div>
          <div class="kv">
            <span>地点与势力</span>
            <div class="tagList">
              <span class="chip">${event.location}</span>
              ${event.factions.map((name) => `<span class="chip">${name}</span>`).join("")}
            </div>
          </div>
          <div class="kv">
            <span>影响结果</span>
            <div>${event.consequences}</div>
          </div>
          <div class="kv">
            <span>伏笔变化</span>
            <div class="hookList">
              ${event.hooks
                .map(
                  (hook, index) => `
                    <div class="hookItem">
                      <strong>${hook}</strong>
                      <span>${index === 0 ? "当前章节重点伏笔，后续章节需要持续追踪。" : "关联伏笔，进入章节事实索引。"}</span>
                    </div>
                  `
                )
                .join("")}
            </div>
          </div>
        `;
      }

      function render() {
        renderFilters();
        renderChapters();
        renderTimeline();
        renderDetail();
      }

      document.addEventListener("click", (event) => {
        const filterButton = event.target.closest("[data-filter]");
        if (filterButton) {
          activeFilter = filterButton.dataset.filter;
          render();
          return;
        }

        const chapterButton = event.target.closest("[data-chapter]");
        if (chapterButton) {
          activeChapter = chapterButton.dataset.chapter;
          const visible = filteredEvents();
          if (visible.length) {
            activeEventId = visible[0].id;
          }
          render();
          return;
        }

        const eventButton = event.target.closest("[data-event]");
        if (eventButton) {
          activeEventId = eventButton.dataset.event;
          renderTimeline();
          renderDetail();
        }
      });

      searchInput.addEventListener("input", (event) => {
        keyword = event.target.value.trim();
        const visible = filteredEvents();
        if (visible.length && !visible.some((item) => item.id === activeEventId)) {
          activeEventId = visible[0].id;
        }
        renderTimeline();
        renderDetail();
      });

      render();
    </script>
  </body>
</html>
