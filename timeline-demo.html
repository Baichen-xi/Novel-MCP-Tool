<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说纪年时间树示意页</title>
    <style>
      :root {
        --paper: #fbf7ef;
        --paper-2: #f7efe3;
        --paper-3: #efe2d0;
        --line: #d7c4aa;
        --line-strong: #b98f69;
        --text: #2f2418;
        --muted: #6e5d4a;
        --accent: #8a5a3d;
        --accent-soft: #ead7c3;
        --green: #6f8662;
        --blue: #6d7ea4;
        --danger: #9a5f52;
        --shadow: 0 18px 42px rgba(72, 54, 31, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.52), transparent 32%),
          radial-gradient(circle at 82% 8%, rgba(109, 126, 164, 0.12), transparent 24%),
          linear-gradient(180deg, #f8f3ea, #efe5d7);
        font-family: "KaiTi", "STKaiti", "Songti SC", "SimSun", serif;
        text-rendering: optimizeLegibility;
      }

      body {
        padding: 28px 28px 10px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(111, 134, 98, 0.32);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .page {
        position: relative;
        max-width: 1480px;
        margin: 0 auto;
      }

      .header {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 15px;
      }

      h1 {
        font-size: 34px;
        line-height: 1.12;
      }

      .subtitle {
        max-width: 86ch;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.82;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
        padding: 14px 16px;
        background: rgba(251, 247, 239, 0.95);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .searchBox {
        display: grid;
        gap: 6px;
        min-width: min(100%, 300px);
      }

      .searchBox span {
        color: var(--muted);
        font-size: 13px;
      }

      .searchBox input {
        min-height: 40px;
        padding: 0 12px;
        color: var(--text);
        background: #fffaf2;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .filterGrid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .filterButton,
      .chip,
      .typePill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 28px;
        padding: 0 10px;
        color: var(--muted);
        background: var(--paper-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .filterButton {
        min-height: 34px;
        padding: 0 12px;
      }

      .filterButton.active {
        color: #533325;
        background: var(--accent-soft);
        border-color: #c59f7c;
      }

      .timelineTree {
        position: relative;
        display: grid;
        gap: 42px;
        min-height: 0;
        padding: 14px 0 30px;
      }

      .timelineTree::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 30px;
        left: 50%;
        width: 4px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(138, 90, 61, 0.16), rgba(138, 90, 61, 0.64) 64%, #8a5a3d 100%);
        border-radius: 999px;
      }

      .timelineTree::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        z-index: 2;
        width: 28px;
        height: 34px;
        transform: translateX(-50%);
        background: #8a5a3d;
        clip-path: polygon(43% 0, 57% 0, 57% 54%, 100% 54%, 50% 100%, 0 54%, 43% 54%);
        filter: drop-shadow(0 3px 5px rgba(72, 54, 31, 0.1));
      }

      .eraHeader {
        position: relative;
        z-index: 4;
        width: max-content;
        max-width: min(88vw, 420px);
        margin: 0 auto;
        padding: 10px 20px;
        text-align: center;
        color: #4f3326;
        background: linear-gradient(180deg, #fff8ed, #ead9c5);
        border: 1px solid #c7a682;
        border-radius: 999px;
        box-shadow: 0 10px 24px rgba(72, 54, 31, 0.11);
      }

      .eraHeader strong {
        font-size: 18px;
      }

      .eraHeader span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .timeNode {
        --tree-gap: 24px;
        --tree-half: 58px;
        --time-offset: 34px;
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 116px minmax(0, 1fr);
        gap: 24px;
        align-items: center;
        min-height: 188px;
      }

      .treeDot {
        position: relative;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin: 0 auto;
        background: #fff8ef;
        border: 2px solid var(--line-strong);
        border-radius: 999px;
        box-shadow: 0 0 0 8px rgba(251, 247, 239, 0.92);
      }

      .treeDot::before {
        content: "";
        width: 9px;
        height: 9px;
        background: var(--accent);
        border-radius: 999px;
      }

      .side {
        display: grid;
        gap: 10px;
        align-content: center;
      }

      .side.left {
        justify-items: end;
      }

      .side.right {
        justify-items: start;
      }

      .eventWrap {
        position: relative;
        display: grid;
        gap: 10px;
        width: min(100%, 470px);
      }

      .connector {
        position: absolute;
        top: 50%;
        z-index: 1;
        width: calc(var(--tree-gap) + var(--tree-half));
        height: 1px;
        border-top: 2px dashed rgba(138, 90, 61, 0.44);
        pointer-events: none;
      }

      .side.left .connector {
        left: 100%;
      }

      .side.right .connector {
        right: 100%;
      }

      .timeRibbon {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 104px;
        max-width: 148px;
        padding: 4px 8px;
        color: #62412f;
        background: #fff8ee;
        border: 1px solid #d2b997;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        white-space: normal;
        line-height: 1.25;
        text-align: center;
        box-shadow: 0 6px 14px rgba(72, 54, 31, 0.08);
        pointer-events: none;
      }

      .side.left .timeRibbon {
        left: calc(100% + var(--tree-gap) + var(--tree-half) + var(--time-offset));
      }

      .side.right .timeRibbon {
        right: calc(100% + var(--tree-gap) + var(--tree-half) + var(--time-offset));
      }

      .eventCard {
        display: grid;
        gap: 10px;
        width: 100%;
        padding: 15px 16px;
        text-align: left;
        color: var(--text);
        background: rgba(255, 251, 244, 0.96);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(72, 54, 31, 0.09);
        transform-origin: center;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .eventCard:hover,
      .eventCard.active {
        border-color: #b88461;
        background: #fff9ef;
        box-shadow: 0 18px 38px rgba(72, 54, 31, 0.16);
      }

      .eventHead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .eventHead h3 {
        font-size: 20px;
        line-height: 1.25;
      }

      .eventSummary {
        color: var(--text);
        line-height: 1.78;
        font-size: 16px;
      }

      .eventMeta,
      .eventTags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .typePill.normal {
        color: #533325;
        background: #ead7c3;
        border-color: #c59f7c;
      }

      .typePill.past {
        color: #43543c;
        background: #e7efdf;
        border-color: #b4c7a6;
      }

      .typePill.memory {
        color: #3c4962;
        background: #e2e8f4;
        border-color: #aeb9d2;
      }

      .typePill.vision {
        color: #705127;
        background: #f0e3c4;
        border-color: #d1b475;
      }

      .typePill.unknown {
        color: #63362f;
        background: #efdcd7;
        border-color: #c8958a;
      }

      .detailCard {
        display: none;
        position: absolute;
        top: 0;
        z-index: 8;
        gap: 12px;
        width: min(390px, calc(100vw - 56px));
        padding: 16px;
        background: rgba(255, 251, 244, 0.98);
        border: 1px solid #d0b590;
        border-radius: 16px;
        box-shadow: 0 16px 32px rgba(72, 54, 31, 0.12);
        visibility: hidden;
        opacity: 0;
      }

      .detailCard.isOpen {
        display: grid;
      }

      .detailCard.alignBottom {
        top: auto;
        bottom: 0;
      }

      .eventWrap.left .detailCard {
        right: calc(100% + 18px);
      }

      .eventWrap.right .detailCard {
        left: calc(100% + 18px);
      }

      .detailCard h3 {
        font-size: 22px;
        line-height: 1.28;
      }

      .detailLead {
        color: var(--muted);
        line-height: 1.7;
      }

      .detailDivider {
        height: 1px;
        background: var(--line);
      }

      .kvList {
        display: grid;
        gap: 11px;
      }

      .kv {
        display: grid;
        gap: 5px;
      }

      .kv span {
        color: var(--muted);
        font-size: 13px;
      }

      .kv div,
      .kv strong {
        line-height: 1.7;
      }

      .hookBox {
        display: grid;
        gap: 8px;
      }

      .hookItem {
        padding: 10px 12px;
        background: rgba(246, 239, 227, 0.76);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .hookItem strong {
        display: block;
        margin-bottom: 3px;
      }

      .hookItem span {
        color: var(--muted);
        line-height: 1.55;
      }

      .empty {
        width: min(680px, 100%);
        margin: 34px auto;
        padding: 28px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 251, 244, 0.72);
        border: 1px dashed var(--line);
        border-radius: 16px;
      }

      .eraNavigator {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 20;
        display: grid;
        gap: 10px;
        width: 230px;
        max-height: calc(100vh - 150px);
        padding: 14px;
        overflow: auto;
        background: rgba(251, 247, 239, 0.94);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 16px 34px rgba(72, 54, 31, 0.12);
      }

      .eraNavigator.isSticky {
        position: fixed;
      }

      .eraNavigator h2 {
        font-size: 18px;
      }

      .eraNavGroup {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 251, 244, 0.72);
        overflow: hidden;
      }

      .eraNavToggle {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 0 11px;
        color: var(--text);
        background: transparent;
        border: 0;
        text-align: left;
        font-weight: 700;
      }

      .eraNavToggle::after {
        content: "收起";
        flex: 0 0 auto;
        color: #8a5a3d;
        font-size: 12px;
      }

      .eraNavToggle span {
        color: var(--muted);
        font-size: 12px;
      }

      .eraNavGroup.collapsed .eraNavToggle::after {
        content: "展开";
        color: var(--muted);
      }

      .eraNavItems {
        --nav-line-x: 18px;
        --nav-item-indent: 34px;
        --nav-dot-size: 11px;
        position: relative;
        display: grid;
        gap: 6px;
        padding: 2px 10px 10px var(--nav-item-indent);
      }

      .eraNavItems::before {
        content: "";
        position: absolute;
        top: 5px;
        bottom: 15px;
        left: var(--nav-line-x);
        width: 1px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(138, 90, 61, 0.18), rgba(138, 90, 61, 0.48));
        z-index: 1;
      }

      .eraNavGroup.collapsed .eraNavItems {
        display: none;
      }

      .eraNavItem {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 7px 9px;
        color: var(--muted);
        background: #fff8ef;
        border: 1px solid var(--line);
        border-radius: 10px;
        text-align: left;
        font-size: 13px;
        line-height: 1.4;
      }

      .eraNavItem::before {
        content: "";
        position: absolute;
        top: 50%;
        left: calc(var(--nav-line-x) - var(--nav-item-indent));
        width: var(--nav-dot-size);
        height: var(--nav-dot-size);
        transform: translate(-50%, -50%);
        background: #fff8ef;
        border: 1px solid #b98f69;
        border-radius: 999px;
        z-index: 2;
      }

      .eraNavItem.active,
      .eraNavItem:hover {
        color: #533325;
        background: var(--accent-soft);
        border-color: #c59f7c;
      }

      .eraNavItem.active::before,
      .eraNavItem:hover::before {
        background: #8a5a3d;
      }

      @media (max-width: 1080px) {
        .eraNavigator {
          position: static;
          width: 100%;
          max-height: none;
          margin-bottom: 16px;
        }

        .timeNode {
          --tree-gap: 16px;
          --tree-half: 36px;
          grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
          gap: 16px;
        }

        .connector,
        .timeRibbon {
          display: none;
        }
      }

      @media (max-width: 820px) {
        .timelineTree::before {
          left: 26px;
        }

        .timelineTree::after {
          left: 26px;
        }

        .eraHeader {
          margin-left: 0;
        }

        .timeNode {
          grid-template-columns: 54px minmax(0, 1fr);
          gap: 12px;
          min-height: 0;
        }

        .treeDot {
          grid-column: 1;
          grid-row: 1 / span 2;
          align-self: start;
          margin-top: 28px;
        }

        .side.left,
        .side.right {
          grid-column: 2;
          justify-items: stretch;
        }

        .side.left {
          grid-row: 1;
        }

        .side.right {
          grid-row: 2;
        }

        .eventWrap {
          width: 100%;
        }

        .detailCard {
          position: static;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="eyebrow">小说知识库 · 纪年时间树示意</p>
        <h1>故事纪年时间树</h1>
        <p class="subtitle">
          以小说纪年作为中轴。左右两侧都可以挂事件卡，卡片与时间树用虚线连接，虚线上显示发生时间；点击哪侧卡片，事件详情就展开在对应侧。
        </p>
      </header>

      <section class="toolbar">
        <label class="searchBox">
          <span>搜索事件</span>

        </label>
        <div class="filterGrid" id="filterGrid"></div>
      </section>

      <aside class="eraNavigator" id="eraNavigator" aria-label="纪年导航"></aside>
      <section class="timelineTree" id="timelineTree"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>

          title: "青岚盟与黑水府翻脸",
          summary: "青岚盟公开质疑黑水府私藏龙渊秘境钥令，两方盟约出现裂缝。",
          narrative: "第 3 章正序讲述",
          location: "青岚洲主城",
          characters: ["青岚盟主", "黑水府使者", "苏璃"],
          factions: ["青岚盟", "黑水府", "圣女殿"],
          consequences: "青岚洲从暗斗转入明争，秘境线提前升温。",
          hooks: ["龙渊秘境钥令", "黑水府背后势力"],
        },
        {
          id: "e-7",
          era: "新星纪元",
          year: "新星纪元 1032 年 秋",
          timeNote: "龙渊秘境开启前夜",
          sort: 1032.8,
          side: "left",
          type: "正序事件",
          title: "黑水府使者失踪",
          summary: "黑水府使者在看守钥令时失踪，现场留下带血传讯符和半截青色鳞片。",
          narrative: "第 4 章正序讲述",
          location: "龙渊秘境入口",
          characters: ["黑水府使者", "苏璃", "林玄"],
          factions: ["黑水府", "青岚盟"],
          consequences: "各方互相怀疑，秘境入口封锁半夜。",
          hooks: ["青色鳞片", "失踪者是否死亡"],
        },
        {
          id: "e-8",
          era: "新星纪元",
          year: "新星纪元 1032 年 秋",
          timeNote: "秘境第一层，子时",
          sort: 1032.81,
          side: "right",
          type: "正序事件",
          title: "林玄血脉第一次失控",
          summary: "林玄接触龙渊石壁后血脉短暂失控，梦见一座沉在虚空海中的龙门。",
          narrative: "第 4 章正序讲述",
          location: "龙渊秘境",
          characters: ["林玄", "苏璃"],
          factions: ["天元宗"],
          consequences: "林玄确认自身血脉与龙渊秘境有关，苏璃隐瞒玉坠反应。",
          hooks: ["虚空海龙门", "苏璃玉坠第二次发热", "林玄血脉来源"],
        },
        {
          id: "e-9",
          era: "未定纪年",
          year: "时间未定",
          timeNote: "未来、梦境或血脉记忆",
          sort: 9999,
          side: "left",
          type: "梦境/预言",
          title: "虚空海龙门幻象",
          summary: "林玄在梦中看见龙门重新升起，但门后的人影称他已经晚了一步。",
          narrative: "第 4 章梦境出现",
          location: "林玄梦境",
          characters: ["林玄", "未知人影"],
          factions: ["古龙族"],
          consequences: "可能预示未来剧情，也可能是血脉记忆。",
          hooks: ["门后人影", "未来是否已发生"],
        },
      ];

      let activeFilter = "全部";
      let keyword = "";
      let activeEventId = "";

      const filterGrid = document.querySelector("#filterGrid");
      const timelineTree = document.querySelector("#timelineTree");
      const eraNavigator = document.querySelector("#eraNavigator");
      const searchInput = document.querySelector("#searchInput");
      const pageShell = document.querySelector(".page");
      const NAV_STICKY_TOP = 118;
      const NAV_RIGHT_GAP = 18;

      function eventMatches(event) {
        const typeOk = activeFilter === "全部" || event.type === activeFilter;
        const text = [
          event.era,
          event.year,
          event.timeNote,
          event.title,
          event.summary,
          event.narrative,
          event.location,
          event.characters.join(" "),
          event.factions.join(" "),
          event.hooks.join(" "),
        ].join(" ");
        return typeOk && (!keyword || text.includes(keyword));
      }

      function sortedEvents() {
        return events.filter(eventMatches).sort((left, right) => left.sort - right.sort);
      }

      function groupByEra(list) {
        return list.reduce((groups, event) => {
          const last = groups[groups.length - 1];
          if (last && last.era === event.era) {
            last.events.push(event);
          } else {
            groups.push({ era: event.era, events: [event] });
          }
          return groups;
        }, []);
      }

      function renderFilters() {
        filterGrid.innerHTML = filters
          .map(
            (filter) => `
              <button class="filterButton ${filter.id === activeFilter ? "active" : ""}" type="button" data-filter="${filter.id}">
                ${filter.label}
              </button>
            `
          )
          .join("");
      }

      function renderNavigator() {
        const groups = groupByEra(sortedEvents());
        eraNavigator.innerHTML = `
          <div class="panelHead">
            <h2>纪年导航</h2>
            <span class="chip">${groups.length} 纪</span>
          </div>
          ${groups
            .map(
              (group) => `
                <section class="eraNavGroup collapsed" data-nav-era="${group.era}">
                  <button class="eraNavToggle" type="button" data-era-toggle="${group.era}">
                    ${group.era}
                    <span>${group.events.length} 条</span>
                  </button>
                  <div class="eraNavItems">
                    ${group.events
                      .map(
                        (event) => `
                          <button class="eraNavItem ${event.id === activeEventId ? "active" : ""}" type="button" data-nav-event="${event.id}">
                            ${event.year}<br />${event.title}
                          </button>
                        `
                      )
                      .join("")}
                  </div>
                </section>
              `
            )
            .join("")}
        `;
        syncNavigatorPosition();
      }

      function renderTimeline() {
        const list = sortedEvents();
        if (activeEventId && !list.some((event) => event.id === activeEventId)) {
          activeEventId = "";
        }
        const groups = groupByEra(list);
        if (!groups.length) {
          timelineTree.innerHTML = `<div class="empty">没有符合当前筛选条件的纪年事件。</div>`;
          animateTimeline();
          return;
        }

        timelineTree.innerHTML = groups
          .map(
            (group) => `
              <section class="eraBlock">
                <div class="eraHeader">
                  <strong>${group.era}</strong>
                  <span>${group.events.length} 条事件</span>
                </div>
                ${group.events.map(renderTimeNode).join("")}
              </section>
            `
          )
          .join("");
        animateTimeline();
      }

      function renderTimeNode(event) {
        const leftEvent = event.side === "left" ? renderEventWrap(event) : "";
        const rightEvent = event.side === "right" ? renderEventWrap(event) : "";
        return `
          <div class="timeNode">
            <div class="side left">${leftEvent}</div>
            <div class="treeDot" aria-hidden="true"></div>
            <div class="side right">${rightEvent}</div>
          </div>
        `;
      }

      function renderEventWrap(event) {
        return `
          <div class="eventWrap ${event.side}" data-wrap="${event.id}">
            <span class="connector"></span>
            <span class="timeRibbon">${event.year}<br />${event.timeNote}</span>
            ${renderEventCard(event)}
            ${renderDetail(event)}
          </div>
        `;
      }

      function renderEventCard(event) {
        return `
          <button class="eventCard ${event.id === activeEventId ? "active" : ""}" type="button" data-event="${event.id}">
            <div class="eventHead">
              <h3>${event.title}</h3>
              <span class="typePill ${typeClass[event.type] || ""}">${event.type}</span>
            </div>
            <p class="eventSummary">${event.summary}</p>
            <div class="eventMeta">
              <span class="chip">叙述：${event.narrative}</span>
              <span class="chip">${event.location}</span>
            </div>
            <div class="eventTags">
              ${event.characters.slice(0, 3).map((name) => `<span class="chip">${name}</span>`).join("")}
              ${event.hooks.slice(0, 2).map((hook) => `<span class="chip">${hook}</span>`).join("")}
            </div>
          </button>
        `;
      }

      function renderDetail(event) {
        return `
          <section class="detailCard" data-detail="${event.id}">
            <p class="eyebrow">事件详情</p>
            <h3>${event.title}</h3>
            <p class="detailLead">${event.year}，${event.timeNote}</p>
            <div class="detailDivider"></div>
            <div class="kvList">
              <div class="kv">
                <span>事件类型</span>
                <div class="eventTags">
                  <span class="typePill ${typeClass[event.type] || ""}">${event.type}</span>
                  <span class="chip">${event.narrative}</span>
                </div>
              </div>
              <div class="kv">
                <span>事件经过</span>
                <div>${event.summary}</div>
              </div>
              <div class="kv">
                <span>涉及人物</span>
                <div class="eventTags">${event.characters.map((name) => `<span class="chip">${name}</span>`).join("")}</div>
              </div>
              <div class="kv">
                <span>地点与势力</span>
                <div class="eventTags">
                  <span class="chip">${event.location}</span>
                  ${event.factions.map((name) => `<span class="chip">${name}</span>`).join("")}
                </div>
              </div>
              <div class="kv">
                <span>影响结果</span>
                <div>${event.consequences}</div>
              </div>
              <div class="kv">
                <span>伏笔变化</span>
                <div class="hookBox">
                  ${event.hooks
                    .map(
                      (hook, index) => `
                        <div class="hookItem">
                          <strong>${hook}</strong>
                          <span>${index === 0 ? "当前事件重点伏笔，后续章节需要持续追踪。" : "关联伏笔，进入纪年时间树索引。"}</span>
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function animateTimeline() {
        if (!window.gsap) {
          return;
        }
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion) {
          gsap.set(".eraHeader, .treeDot, .eventCard, .detailCard", { clearProps: "all" });
          return;
        }
        const tl = gsap.timeline({ defaults: { duration: 0.36, ease: "power2.out" } });
        tl.from(".eraHeader", { autoAlpha: 0, y: 10, stagger: 0.05 })
          .from(".treeDot", { autoAlpha: 0, scale: 0.82, stagger: 0.035 }, "<0.02")
          .from(".eventCard", { autoAlpha: 0, y: 16, stagger: 0.04 }, "<0.08");
      }

      function attachHoverMotion() {
        if (!window.gsap) {
          return;
        }
        document.querySelectorAll(".eventCard").forEach((card) => {
          card.addEventListener("mouseenter", () => {
            gsap.to(card, { scale: 1.025, y: -3, duration: 0.18, ease: "power2.out", overwrite: "auto" });
          });
          card.addEventListener("mouseleave", () => {
            gsap.to(card, { scale: 1, y: 0, duration: 0.18, ease: "power2.out", overwrite: "auto" });
          });
        });
      }

      function render() {
        renderFilters();
        renderTimeline();
        renderNavigator();
        syncActiveDetail(false);
        attachHoverMotion();
        syncNavigatorPosition();
      }

      function syncNavigatorPosition() {
        if (window.innerWidth <= 1080) {
          eraNavigator.classList.remove("isSticky");
          eraNavigator.style.top = "";
          eraNavigator.style.left = "";
          eraNavigator.style.right = "";
          return;
        }

        const pageRect = pageShell.getBoundingClientRect();
        const navWidth = eraNavigator.offsetWidth;
        const naturalTop = timelineTree.offsetTop;
        const naturalViewportTop = pageRect.top + naturalTop;
        const fixedLeft = window.innerWidth - navWidth - NAV_RIGHT_GAP;
        const absoluteLeft = fixedLeft - pageRect.left;

        eraNavigator.style.left = `${absoluteLeft}px`;
        eraNavigator.style.right = "auto";

        if (naturalViewportTop <= NAV_STICKY_TOP) {
          eraNavigator.classList.add("isSticky");
          eraNavigator.style.top = `${NAV_STICKY_TOP}px`;
          eraNavigator.style.left = `${fixedLeft}px`;
        } else {
          eraNavigator.classList.remove("isSticky");
          eraNavigator.style.top = `${naturalTop}px`;
        }
      }

      function syncActiveDetail(animate = true) {
        document.querySelectorAll(".eventCard").forEach((card) => {
          card.classList.toggle("active", card.dataset.event === activeEventId);
        });
        document.querySelectorAll(".eraNavItem").forEach((item) => {
          item.classList.toggle("active", item.dataset.navEvent === activeEventId);
        });
        document.querySelectorAll(".detailCard").forEach((detail) => {
          const shouldShow = detail.dataset.detail === activeEventId;
          if (shouldShow) {
            detail.classList.add("isOpen");
            updateDetailAlignment(detail);
          }
          if (!window.gsap) {
            detail.classList.toggle("isOpen", shouldShow);
            if (!shouldShow) {
              detail.classList.remove("alignBottom");
            }
            detail.style.visibility = shouldShow ? "visible" : "hidden";
            detail.style.opacity = shouldShow ? "1" : "0";
            return;
          }
          gsap.to(detail, {
            autoAlpha: shouldShow ? 1 : 0,
            y: shouldShow ? 0 : 8,
            duration: animate ? 0.18 : 0,
            ease: "power2.out",
            overwrite: "auto",
            onComplete: () => {
              if (detail.dataset.detail !== activeEventId) {
                detail.classList.remove("isOpen");
                detail.classList.remove("alignBottom");
              }
            },
          });
        });
      }

      function updateDetailAlignment(detail) {
        detail.classList.remove("alignBottom");
        const wrap = detail.closest(".eventWrap");
        if (!wrap) {
          return;
        }
        const wrapRect = wrap.getBoundingClientRect();
        const detailHeight = detail.scrollHeight;
        const viewportBottom = window.innerHeight - 24;
        const wouldOverflow = wrapRect.top + detailHeight > viewportBottom;
        detail.classList.toggle("alignBottom", wouldOverflow);
      }

      document.addEventListener("click", (event) => {
        const filterButton = event.target.closest("[data-filter]");
        if (filterButton) {
          activeFilter = filterButton.dataset.filter;
          render();
          return;
        }

        const eventButton = event.target.closest("[data-event]");
        if (eventButton) {
          activeEventId = activeEventId === eventButton.dataset.event ? "" : eventButton.dataset.event;
          syncActiveDetail(true);
          return;
        }

        const navToggle = event.target.closest("[data-era-toggle]");
        if (navToggle) {
          navToggle.closest(".eraNavGroup")?.classList.toggle("collapsed");
          syncNavigatorPosition();
          return;
        }

        const navEvent = event.target.closest("[data-nav-event]");
        if (navEvent) {
          activeEventId = navEvent.dataset.navEvent;
          syncActiveDetail(true);
          document.querySelector(`[data-wrap="${activeEventId}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });

      searchInput.addEventListener("input", (event) => {
        keyword = event.target.value.trim();
        renderTimeline();
        renderNavigator();
        syncActiveDetail(false);
        attachHoverMotion();
        syncNavigatorPosition();
      });

      window.addEventListener("resize", () => {
        syncNavigatorPosition();
        if (activeEventId) {
          syncActiveDetail(false);
        }
      });

      window.addEventListener("scroll", syncNavigatorPosition, { passive: true });

      render();
    </script>
  </body>
</html>
